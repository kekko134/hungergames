<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panem Control System • Arena Edition</title>
    <!-- Font arrotondati e stile retro-cute/tecnologico -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-sky: #eaf3ff;
            --gingham-1: rgba(168, 206, 255, 0.4);
            --gingham-2: rgba(198, 224, 255, 0.45);
            --card-bg: #ffffff;
            --accent-blue: #4084ff;
            --accent-glow: rgba(64, 132, 255, 0.25);
            --border-dark: #1b365d;
            --text-main: #1b365d;
            --text-soft: #4a6b98;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-sky);
            background-image:
                linear-gradient(90deg, var(--gingham-1) 50%, transparent 50%),
                linear-gradient(var(--gingham-2) 50%, transparent 50%);
            background-size: 40px 40px;
            color: var(--text-main);
            font-family: 'Fredoka', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .window-card {
            background: var(--card-bg);
            border: 3px solid var(--border-dark);
            border-radius: 24px;
            box-shadow: 0 10px 0 var(--border-dark), 0 15px 30px var(--accent-glow);
            max-width: 540px;
            width: 100%;
            overflow: hidden;
            position: relative;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .window-bar {
            background: #cce1ff;
            border-bottom: 3px solid var(--border-dark);
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .window-dots {
            display: flex;
            gap: 6px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid var(--border-dark);
        }

        .dot-1 { background: #ff765e; }
        .dot-2 { background: #ffc247; }
        .dot-3 { background: #4084ff; }

        .window-title {
            font-family: 'Silkscreen', cursive;
            font-size: 0.72rem;
            color: var(--border-dark);
            letter-spacing: 1px;
        }

        .content {
            padding: 26px 22px;
            text-align: center;
        }

        h1 {
            font-size: 1.55rem;
            font-weight: 700;
            color: var(--border-dark);
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        h2 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 16px;
            line-height: 1.35;
        }

        p {
            color: var(--text-soft);
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 18px;
        }

        .code-display {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 16px 0;
        }

        .code-slot {
            width: 46px;
            height: 50px;
            background: #f0f6ff;
            border: 3px solid var(--border-dark);
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.4rem;
            font-weight: 700;
            box-shadow: 0 4px 0 var(--border-dark);
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-width: 240px;
            margin: 18px auto 10px;
        }

        .key-btn {
            background: #dceafc;
            border: 3px solid var(--border-dark);
            border-radius: 14px;
            padding: 12px;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--border-dark);
            cursor: pointer;
            box-shadow: 0 4px 0 var(--border-dark);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .key-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 var(--border-dark);
        }

        .key-btn.action-btn {
            background: #cce1ff;
            font-size: 1rem;
        }

        .cute-btn {
            background: var(--accent-blue);
            border: 3px solid var(--border-dark);
            border-radius: 16px;
            padding: 13px 22px;
            font-family: 'Fredoka', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            cursor: pointer;
            box-shadow: 0 5px 0 var(--border-dark);
            transition: all 0.12s ease;
            display: inline-block;
            width: 100%;
            margin-top: 8px;
        }

        .cute-btn:hover {
            background: #2b70e8;
        }

        .cute-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 var(--border-dark);
        }

        .option-btn {
            background: #f7fafl;
            border: 3px solid var(--border-dark);
            border-radius: 16px;
            padding: 13px 16px;
            margin-bottom: 12px;
            width: 100%;
            text-align: left;
            font-family: 'Fredoka', sans-serif;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--border-dark);
            cursor: pointer;
            box-shadow: 0 4px 0 var(--border-dark);
            transition: all 0.12s ease;
        }

        .option-btn:hover {
            background: #dceafc;
            transform: translateY(-2px);
        }

        .option-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 var(--border-dark);
        }

        .gifts-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 18px 0;
        }

        .gift-box {
            background: #dceafc;
            border: 3px solid var(--border-dark);
            border-radius: 18px;
            padding: 18px 10px;
            cursor: pointer;
            box-shadow: 0 5px 0 var(--border-dark);
            transition: all 0.15s ease;
        }

        .gift-box:hover {
            background: #cce1ff;
            transform: translateY(-3px);
        }

        .gift-box:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 var(--border-dark);
        }

        .gift-box.opened {
            background: #c7f2e2;
        }

        .gift-label {
            font-weight: 700;
            font-size: 0.9rem;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(27, 54, 93, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            z-index: 100;
        }

        .modal-card {
            background: #ffffff;
            border: 3px solid var(--border-dark);
            border-radius: 22px;
            box-shadow: 0 8px 0 var(--border-dark);
            max-width: 440px;
            width: 100%;
            padding: 22px;
            text-align: center;
            animation: popIn 0.25s ease;
            max-height: 90vh;
            overflow-y: auto;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin: 14px 0;
        }

        .flip-card {
            background-color: transparent;
            height: 90px;
            perspective: 1000px;
            cursor: pointer;
        }

        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            border-radius: 14px;
            box-shadow: 0 4px 0 var(--border-dark);
        }

        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }

        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border: 3px solid var(--border-dark);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            font-size: 0.82rem;
            font-weight: 600;
        }

        .flip-card-front {
            background-color: #dceafc;
            color: var(--border-dark);
        }

        .flip-card-back {
            background-color: #c7f2e2;
            color: var(--border-dark);
            transform: rotateY(180deg);
            font-size: 0.78rem;
            line-height: 1.25;
        }

        .progress-indicator {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 14px;
            letter-spacing: 2px;
            color: var(--text-soft);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="window-card">
    <div class="window-bar">
        <div class="window-dots">
            <span class="dot dot-1"></span>
            <span class="dot dot-2"></span>
            <span class="dot dot-3"></span>
        </div>
        <span class="window-title">PANEM_CONTROL_SYS</span>
        <span></span>
    </div>

    <!-- SCHERMATA 1: CODICE SEGRETO -->
    <div class="content" id="screen-lock">
        <h1>Accesso Area Strategist</h1>
        <p id="hint-text">Indizio: il numero che ti rappresenta</p>

        <div class="code-display">
            <div class="code-slot" id="slot-0">-</div>
            <div class="code-slot" id="slot-1">-</div>
            <div class="code-slot" id="slot-2">-</div>
            <div class="code-slot" id="slot-3">-</div>
        </div>

        <p id="error-msg" style="color: #ff523b; font-weight: 600; font-size: 0.88rem; min-height: 20px; margin-bottom: 4px;"></p>

        <div class="keypad">
            <button class="key-btn" onclick="pressKey('1')">1</button>
            <button class="key-btn" onclick="pressKey('2')">2</button>
            <button class="key-btn" onclick="pressKey('3')">3</button>
            <button class="key-btn" onclick="pressKey('4')">4</button>
            <button class="key-btn" onclick="pressKey('5')">5</button>
            <button class="key-btn" onclick="pressKey('6')">6</button>
            <button class="key-btn" onclick="pressKey('7')">7</button>
            <button class="key-btn" onclick="pressKey('8')">8</button>
            <button class="key-btn" onclick="pressKey('9')">9</button>
            <button class="key-btn action-btn" onclick="clearCode()">C</button>
            <button class="key-btn" onclick="pressKey('0')">0</button>
            <button class="key-btn action-btn" onclick="checkCode()">OK</button>
        </div>
    </div>

    <!-- SCHERMATA 2: QUIZ CUTE (ESATTAMENTE 9 DOMANDE) -->
    <div class="content hidden" id="screen-quiz">
        <div class="progress-indicator" id="progress-indicator">Domanda 1 di 9</div>
        <h2 id="question-text">Domanda qui</h2>
        <div id="options-container"></div>
    </div>

    <!-- SCHERMATA 3: I 3 PARACADUTE REGALO -->
    <div class="content hidden" id="screen-gifts">
        <h1>Sopravvissuta all'Arena</h1>
        <p>Il quartier generale di Capitol City ha sbloccato 3 Paracadute speciali. Cliccali tutti per aprirli.</p>

        <div class="gifts-grid">
            <div class="gift-box" id="gift-1" onclick="openGift(1)">
                <span class="gift-label">Dono 1</span>
            </div>
            <div class="gift-box" id="gift-2" onclick="openGift(2)">
                <span class="gift-label">Dono 2</span>
            </div>
            <div class="gift-box" id="gift-3" onclick="openGift(3)">
                <span class="gift-label">Dono 3</span>
            </div>
        </div>

        <button class="cute-btn" style="margin-top: 15px; background: #dceafc; color: var(--border-dark);" onclick="restartApp()">Torna all'inizio</button>
    </div>
</div>

<!-- POPUP MODALE -->
<div class="modal-overlay hidden" id="modal" onclick="closeModal(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
        <div id="modal-body"></div>
        <button class="cute-btn" style="margin-top: 16px;" onclick="forceCloseModal()">Chiudi</button>
    </div>
</div>

<script>
    const CODICE_SEGRETO = "9999"; 
    const INDIZIO_CODICE = "Indizio: il numero che ti rappresenta";

    document.getElementById("hint-text").innerText = INDIZIO_CODICE;
    let enteredCode = "";

    function pressKey(num) {
        if (enteredCode.length < 4) {
            enteredCode += num;
            updateSlots();
            document.getElementById("error-msg").innerText = "";
        }
        if (enteredCode.length === 4) {
            setTimeout(checkCode, 250);
        }
    }

    function clearCode() {
        enteredCode = "";
        updateSlots();
        document.getElementById("error-msg").innerText = "";
    }

    function updateSlots() {
        for (let i = 0; i < 4; i++) {
            const slot = document.getElementById(`slot-${i}`);
            slot.innerText = enteredCode[i] ? enteredCode[i] : "-";
        }
    }

    function checkCode() {
        if (enteredCode === CODICE_SEGRETO) {
            document.getElementById("screen-lock").classList.add("hidden");
            document.getElementById("screen-quiz").classList.remove("hidden");
            showQuestion();
        } else {
            document.getElementById("error-msg").innerText = "Codice errato, Tributo. Riprova.";
            enteredCode = "";
            setTimeout(updateSlots, 500);
        }
    }

    // ESATTAMENTE 9 DOMANDE (LA NONA È QUELLA FINALE DEL VERO)
    const questions = [
        {
            question: "1. Suona il gong iniziale. Vedi la Cornucopia piena di rifornimenti. Cosa fai?",
            options: [
                { text: "Afferro uno zaino al volo e corro subito nel bosco", points: 5 },
                { text: "Cerco subito il mio alleato preferito per scappare insieme", points: 4 },
                { text: "Corro dritta al centro senza esitare", points: 3 }
            ]
        },
        {
            question: "2. È notte nell'Arena e fa molto freddo. Qual è la tua mossa?",
            options: [
                { text: "Mi arrampico sull'albero più alto e mi lego ai rami in sicurezza", points: 5 },
                { text: "Mi nascondo in una grotta accogliente al buio", points: 4 },
                { text: "Aspetto che il mio Sponsor mi mandi rifornimenti caldi", points: 3 }
            ]
        },
        {
            question: "3. Incontri un corso d'acqua limpida ma potresti essere scoperta. Che fai?",
            options: [
                { text: "Riempio la borraccia rapidamente e torno tra gli alberi", points: 5 },
                { text: "Studio la zona prima di avvicinarmi con prudenza", points: 4 },
                { text: "Aspetto la pioggia per non rischiare", points: 3 }
            ]
        },
        {
            question: "4. Qual è la tua vera arma segreta per conquistare gli Sponsor di Capitol City?",
            options: [
                { text: "La mia astuzia e il sangue freddo nei momenti critici", points: 5 },
                { text: "Il mio sorriso capace di illuminare anche l'Arena", points: 5 },
                { text: "La mia testardaggine: non mollo mai", points: 4 }
            ]
        },
        {
            question: "5. Senti un rumore sospetto tra i cespugli vicini al tuo rifugio. Come reagisci?",
            options: [
                { text: "Preparo l'arco e mantengo la posizione in silenzio", points: 5 },
                { text: "Mi sposto lentamente verso un punto di osservazione migliore", points: 4 },
                { text: "Resto immobile sperando che passi oltre", points: 3 }
            ]
        },
        {
            question: "6. Gli Strategist attivano un incendio controllato per spingerti verso il centro. Dove vai?",
            options: [
                { text: "Vado controvento verso la zona umida e sicura", points: 5 },
                { text: "Seguo il sentiero meno battuto tracciato in precedenza", points: 4 },
                { text: "Corro veloce senza fermarmi dove capita", points: 3 }
            ]
        },
        {
            question: "7. Trovi un riparo sicuro con scorte avanzate lasciate da un altro Tributo. Che fai?",
            options: [
                { text: "Prendo solo lo stretto necessario e lascio intatto il resto", points: 5 },
                { text: "Controllo che non ci siano trappole prima di toccare nulla", points: 4 },
                { text: "Uso il riparo per riposare qualche ora", points: 3 }
            ]
        },
        {
            question: "8. Il cielo si oscura ed è il momento di scegliere dove accamparsi. La tua scelta?",
            options: [
                { text: "Un punto rialzato con visuale completa su tutto il perimetro", points: 5 },
                { text: "Una fenditura nella roccia ben mimetizzata dalla vegetazione", points: 4 },
                { text: "Vicino a un ruscello per ascoltare eventuali movimenti", points: 3 }
            ]
        },
        {
            question: "9. Domanda finale: Vero o non vero che il tuo Sponsor è la persona migliore che potessi trovare?",
            isFinal: true
        }
    ];

    let currentQ = 0;
    let score = 0;

    function showQuestion() {
        const q = questions[currentQ];
        document.getElementById("question-text").innerText = q.question;
        document.getElementById("progress-indicator").innerText = `Domanda ${currentQ + 1} di ${questions.length}`;

        const container = document.getElementById("options-container");
        container.innerHTML = "";

        if (q.isFinal) {
            const btnTrue = document.createElement("button");
            btnTrue.className = "option-btn";
            btnTrue.style.background = "#cce1ff";
            btnTrue.innerHTML = "<strong>Vero</strong> (Sblocca i Paracadute)";
            btnTrue.onclick = () => {
                document.getElementById("screen-quiz").classList.add("hidden");
                document.getElementById("screen-gifts").classList.remove("hidden");
            };
            container.appendChild(btnTrue);

            const btnFalse = document.createElement("button");
            btnFalse.className = "option-btn";
            btnFalse.id = "runaway-btn";
            btnFalse.innerText = "Non vero";
            btnFalse.onmouseover = moveBtn;
            btnFalse.onclick = moveBtn;
            container.appendChild(btnFalse);
        } else {
            q.options.forEach(opt => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerText = opt.text;
                btn.onclick = () => {
                    score += opt.points;
                    currentQ++;
                    showQuestion();
                };
                container.appendChild(btn);
            });
        }
    }

    function moveBtn() {
        const btn = document.getElementById("runaway-btn");
        const x = Math.floor(Math.random() * 140) - 70;
        const y = Math.floor(Math.random() * 80) - 40;
        btn.style.transform = `translate(${x}px, ${y}px)`;
    }

    function restartApp() {
        currentQ = 0;
        score = 0;
        enteredCode = "";
        updateSlots();
        document.getElementById("screen-gifts").classList.add("hidden");
        document.getElementById("screen-lock").classList.remove("hidden");
    }

    function openGift(num) {
        document.getElementById(`gift-${num}`).classList.add("opened");
        const body = document.getElementById("modal-body");

        if (num === 1) {
            body.innerHTML = `
                <h2>Dono 1: Parole dall'Arena</h2>
                <p style="font-size: 0.85rem; margin-bottom: 10px;">Clicca su ogni tessera per girarla e scoprire i messaggi dedicati a te.</p>
                <div class="cards-grid">
                    <div class="flip-card" onclick="this.classList.toggle('flipped')">
                        <div class="flip-card-inner">
                            <div class="flip-card-front">Tessera 1</div>
                            <div class="flip-card-back">Sei il mio posto sicuro</div>
                        </div>
                    </div>
                    <div class="flip-card" onclick="this.classList.toggle('flipped')">
                        <div class="flip-card-inner">
                            <div class="flip-card-front">Tessera 2</div>
                            <div class="flip-card-back">Mi fai sempre sorridere</div>
                        </div>
                    </div>
                    <div class="flip-card" onclick="this.classList.toggle('flipped')">
                        <div class="flip-card-inner">
                            <div class="flip-card-front">Tessera 3</div>
                            <div class="flip-card-back">La mia alleata preferita</div>
                        </div>
                    </div>
                    <div class="flip-card" onclick="this.classList.toggle('flipped')">
                        <div class="flip-card-inner">
                            <div class="flip-card-front">Tessera 4</div>
                            <div class="flip-card-back">Meravigliosa sempre</div>
                        </div>
                    </div>
                    <div class="flip-card" onclick="this.classList.toggle('flipped')">
                        <div class="flip-card-inner">
                            <div class="flip-card-front">Tessera 5</div>
                            <div class="flip-card-back">Insieme contro ogni avversità</div>
                        </div>
                    </div>
                    <div class="flip-card" onclick="this.classList.toggle('flipped')">
                        <div class="flip-card-inner">
                            <div class="flip-card-front">Tessera 6</div>
                            <div class="flip-card-back">La luce in ogni situazione</div>
                        </div>
                    </div>
                </div>
                <div class="flip-card" style="width: 100%; margin-top: 4px;" onclick="this.classList.toggle('flipped')">
                    <div class="flip-card-inner">
                        <div class="flip-card-front">Tessera Speciale 7 (Clicca qui)</div>
                        <div class="flip-card-back">Non smettere mai di brillare</div>
                    </div>
                </div>
            `;
        } else if (num === 2) {
            body.innerHTML = `
                <h2>Dono 2: Valutazione Ufficiale</h2>
                <p>Punteggio totale acquisito nell'Arena: <strong>11 di 12</strong></p>
                <div style="background: #f7fafl; padding: 12px; border-radius: 12px; border: 2px solid var(--border-dark); margin-top: 10px; font-size: 0.9rem;">
                    Gli Strategist di Capitol City confermano: hai l'istinto di Katniss e una determinazione senza pari. Sopravviveresti a qualsiasi prova.
                </div>
            `;
        } else if (num === 3) {
            body.innerHTML = `
                <h2>Dono 3: Messaggio degli Sponsor</h2>
                <p id="dono3-text">Rispondi alla domanda per leggere il messaggio segreto:</p>
                <div id="dono3-content" style="margin-top: 12px;">
                    <p style="font-weight: 600; margin-bottom: 8px;">Vero o non vero che sceglieresti sempre me?</p>
                    <button class="cute-btn" onclick="unlockDono3()">Vero</button>
                    <button class="cute-btn" style="background: #ff765e; margin-top: 6px;" onclick="alert('Risposta non valida nell Arena')">Non vero</button>
                </div>
            `;
        }

        document.getElementById("modal").classList.remove("hidden");
    }

    function unlockDono3() {
        document.getElementById("dono3-content").innerHTML = `
            <div style="background: #f0f6ff; padding: 14px; border-radius: 14px; border: 2px dashed var(--border-dark); font-size: 0.92rem; line-height: 1.5;">
                In qualsiasi Arena della vita, la risposta è sempre e solo una: Vero. Sempre.
            </div>
        `;
    }

    function forceCloseModal() {
        document.getElementById("modal").classList.add("hidden");
    }

    function closeModal(e) {
        if (e.target.id === "modal") {
            forceCloseModal();
        }
    }
</script>

</body>
</html>
